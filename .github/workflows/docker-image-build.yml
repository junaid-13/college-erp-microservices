name: docker-image-build

on:
  workflow_call:
    inputs:
      changed_portals:
        description: "JSON array (as string) of changed portal names."
        required: false
        type: string
        default: "[]"
      changed_services:
        description: "JSON array (as string) of changed service names."
        required: false
        type: string
        default: "[]"
      image_tag:
        description: "Tag to apply to built images (defaults to the caller commit SHA)"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username / namespace to push under"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub access token"
        required: true

concurrency:
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portals:
    name: Build portal image (${{ matrix.portal }})
    if: ${{ inputs.changed_portals != '' && inputs.changed_portals != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: ${{ fromJSON(inputs.changed_portals) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile and resolve image metadata
        id: meta
        shell: bash
        run: |
          PORTAL_DIR="frontend/${{ matrix.portal }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.portal }}"
          TAG="${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}"

          if [ -f "${PORTAL_DIR}/Dockerfile" ]; then
            echo "Dockerfile found for portal '${{ matrix.portal }}' at ${PORTAL_DIR}/Dockerfile."
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No Dockerfile::Skipping portal '${{ matrix.portal }}' — no Dockerfile at ${PORTAL_DIR}/Dockerfile."
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

          echo "context=." >> "$GITHUB_OUTPUT"
          echo "dockerfile=${PORTAL_DIR}/Dockerfile" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ steps.meta.outputs.has_dockerfile == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push portal image
        if: ${{ steps.meta.outputs.has_dockerfile == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  build-services:
    name: Build service image (${{ matrix.service }})
    if: ${{ inputs.changed_services != '' && inputs.changed_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.changed_services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile and resolve image metadata
        id: meta
        shell: bash
        run: |
          SERVICE_DIR="backend/${{ matrix.service }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}"
          TAG="${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}"

          if [ -f "${SERVICE_DIR}/Dockerfile" ]; then
            echo "Dockerfile found for service '${{ matrix.service }}' at ${SERVICE_DIR}/Dockerfile."
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No Dockerfile::Skipping service '${{ matrix.service }}' — no Dockerfile at ${SERVICE_DIR}/Dockerfile."
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

          echo "context=${SERVICE_DIR}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${SERVICE_DIR}/Dockerfile" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ steps.meta.outputs.has_dockerfile == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push service image
        if: ${{ steps.meta.outputs.has_dockerfile == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
