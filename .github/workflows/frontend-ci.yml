name: CI-feature

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - feat/**
      - fix/**

jobs:
  Finding-the-difference:
    runs-on: ubuntu-latest

    outputs:
      frontend_changed: ${{steps.changes.outputs.frontend}}
      backend_changed: ${{steps.changes.outputs.backend}}
      changed_portals: ${{ steps.components.outputs.changed_portals }}
      changed_services: ${{ steps.components.outputs.changed_services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            shared:
              - 'shared/**'

      - name: Resolve changed portals and services
        id: components
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # base: just diff the most recent commit.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi

          echo "Diffing ${BASE_SHA}...${{ github.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          extract() {
            root="$1"
            printf '%s\n' "$CHANGED_FILES" \
              | awk -F/ -v root="$root" '$1 == root && NF >= 2 { print $2 }' \
              | sort -u \
              | while read -r name; do
                  [ -n "$name" ] && [ -d "${root}/${name}" ] && printf '%s\n' "$name"
                done \
              | jq -R . | jq -s -c .
          }

          PORTALS="$(extract frontend)"
          SERVICES="$(extract backend)"

          echo "Changed portals:  $PORTALS"
          echo "Changed services: $SERVICES"
          echo "changed_portals=$PORTALS" >> "$GITHUB_OUTPUT"
          echo "changed_services=$SERVICES" >> "$GITHUB_OUTPUT"
  Linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          npx eslint . -f html -o eslint-report-${{ github.workflow }}.html
          npx eslint . -f json -o eslint-report.json

          ERROR_COUNT=$(jq '[.[].errorCount] | add' eslint-report.json)
          WARNING_COUNT=$(jq '[.[].warningCount] | add' eslint-report.json)

          echo "Errors: $ERROR_COUNT"
          echo "Warnings: $WARNING_COUNT"

          echo "errors=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "warnings=$WARNING_COUNT" >> $GITHUB_OUTPUT

          if [ "$ERROR_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ]; then
            exit 1
          fi

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eslint-report-${{ github.run_id }}
          path: |
            eslint-report-${{ github.workflow }}.html
          if-no-files-found: ignore

  Formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # - name: Install dependencies
      #  run: npm ci

      - name: Check formatting
        run: npx prettier . --check

  Secret-Scanning:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  Dependancy-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          mkdir -p contrib
          curl -L https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
          -o contrib/html.tpl

      - name: Run dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          format: template
          template: "@contrib/html.tpl"
          output: dependency-report.html
          scanners: vuln
          vuln-type: library

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-${{ github.run_id }}
          path: dependency-report.html
          retention-days: 30

  Unit-Tests:
    runs-on: ubuntu-latest
    needs:
      - Finding-the-difference
      - Linting
      - Formatting
      - Secret-Scanning
      - Dependancy-scanning

    outputs:
      run-frontend-tests: ${{ steps.run-frontend-tests.outcome }}
      run-backend-tests: ${{ steps.run-backend-tests.outcome }}

    steps:
      - name: Checkout code college-erp
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MERN_ERP_TOKEN }}
          path: college-erp-microservices

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "college-erp-microservices/package-lock.json"

      - name: Install ERP dependencies
        working-directory: college-erp-microservices
        run: npm ci

      - name: Checkout code college-erp-test
        uses: actions/checkout@v5
        with:
          repository: junaid-13/college-erp-microservices-testing
          token: ${{ secrets.TEST_TOKEN }}
          path: erp-test

      - name: Install dependencies college-erp-test
        working-directory: erp-test
        run: |
          npm install

      - name: Run Frontend Unit Tests
        if: needs.Finding-the-difference.outputs.frontend_changed == 'true'
        id: run-frontend-tests
        working-directory: erp-test
        run: |
          echo "Frontend changes detected"
          npx vitest --run --coverage

      - name: Upload coverage report
        if: always() && needs.Finding-the-difference.outputs.frontend_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vitest-coverage-report-${{ github.run_id }}
          path: erp-test/coverage-vitest
          if-no-files-found: warn
          retention-days: 30

      - name: Run Backend Unit Tests
        if: needs.Finding-the-difference.outputs.backend_changed == 'true'
        working-directory: erp-test
        id: run-backend-tests
        run: |
          echo "Backend changes detected"
          npx jest --coverage

      - name: Upload coverage report
        if: always() && needs.Finding-the-difference.outputs.backend_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: jest-coverage-report-${{ github.run_id }}
          path: erp-test/coverage-jest
          if-no-files-found: warn
          retention-days: 30
  Metadata:
    name: Generate Build Metadata
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      branch: ${{ steps.metadata.outputs.branch }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      workflow: ${{ steps.metadata.outputs.workflow }}
      run_id: ${{ steps.metadata.outputs.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA="${GITHUB_SHA}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          RUN_ID="${GITHUB_RUN_ID}"
          WORKFLOW="${GITHUB_WORKFLOW}"

          VERSION="1.0.${SHORT_SHA}"

          {
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "branch=${BRANCH}"
            echo "build_date=${BUILD_DATE}"
            echo "workflow=${WORKFLOW}"
            echo "run_id=${RUN_ID}"
          } >> "$GITHUB_OUTPUT"


  Docker-images:
    needs:
      - Finding-the-difference
      - Unit-Tests
      - Metadata
    uses: ./.github/workflows/docker-image-build.yml
    with:
      changed_portals: ${{ needs.Finding-the-difference.outputs.changed_portals }}
      changed_services: ${{ needs.Finding-the-difference.outputs.changed_services }}
      image_tag: ${{ needs.Metadata.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
